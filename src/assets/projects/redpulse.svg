<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0209"/>
      <stop offset="55%" stop-color="#3b0512"/>
      <stop offset="100%" stop-color="#0b0206"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d5e"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d90429" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#d90429" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#grid)"/>
  <circle cx="740" cy="180" r="240" fill="url(#glow)"/>

  <!-- browser chrome -->
  <rect x="60" y="60" width="840" height="480" rx="22" fill="#12040a" stroke="#ffffff" stroke-opacity=".10"/>
  <rect x="60" y="60" width="840" height="46" rx="22" fill="#1d060e"/>
  <rect x="60" y="92" width="840" height="14" fill="#1d060e"/>
  <circle cx="90" cy="83" r="6" fill="#ff5f57"/>
  <circle cx="112" cy="83" r="6" fill="#febc2e"/>
  <circle cx="134" cy="83" r="6" fill="#28c840"/>
  <rect x="160" y="73" width="300" height="20" rx="10" fill="#ffffff" fill-opacity=".07"/>
  <text x="176" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffb3bd">patiya-red-pulse.vercel.app</text>

  <!-- live badge -->
  <rect x="100" y="134" width="212" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ff4d5e" stroke-opacity=".45"/>
  <circle cx="120" cy="149" r="5" fill="#ff4d5e"/>
  <text x="136" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#ffd6dc">Live donor network · Patiya</text>

  <!-- headline -->
  <text x="100" y="228" font-family="Oswald, Impact, sans-serif" font-size="58" font-weight="700" fill="#ffffff">PATIYA</text>
  <text x="100" y="292" font-family="Oswald, Impact, sans-serif" font-size="58" font-weight="700" fill="url(#red)">REDPULSE</text>
  <text x="102" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#e8b9c2">Blood seekers connected straight to eligible donors.</text>

  <!-- buttons -->
  <rect x="100" y="356" width="168" height="44" rx="22" fill="url(#red)"/>
  <text x="128" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Find donors now</text>
  <rect x="284" y="356" width="150" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
  <text x="310" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#ffd6dc">Submit request</text>

  <!-- ECG line -->
  <path d="M100 452 H196 l14 -38 14 76 16 -96 18 118 16 -60 h30 l12 -22 12 22 H520"
        fill="none" stroke="url(#red)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>

  <!-- blood group chips -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    <rect x="556" y="150" width="76" height="76" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ff4d5e" stroke-opacity=".35"/>
    <text x="580" y="186" fill="#ffffff">O+</text><text x="578" y="210" font-size="12" fill="#ff8d9b">3 free</text>
    <rect x="648" y="150" width="76" height="76" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="672" y="186" fill="#ffffff">A+</text><text x="670" y="210" font-size="12" fill="#ff8d9b">1 free</text>
    <rect x="740" y="150" width="76" height="76" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="764" y="186" fill="#ffffff">B+</text><text x="762" y="210" font-size="12" fill="#ff8d9b">2 free</text>
    <rect x="556" y="242" width="76" height="76" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="574" y="278" fill="#ffffff">AB+</text><text x="578" y="302" font-size="12" fill="#ff8d9b">1 free</text>
    <rect x="648" y="242" width="168" height="76" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="668" y="274" fill="#ffffff" font-size="14">Eligibility timer</text>
    <text x="668" y="298" font-size="12" font-weight="400" fill="#ff8d9b">90 / 120 day countdown</text>
  </g>

  <!-- droplet -->
  <path d="M760 372c0 0-46 44-46 74a46 46 0 1 0 92 0c0-30-46-74-46-74z" fill="url(#red)" opacity=".92"/>
  <path d="M742 448a18 18 0 0 0 18 18" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>

  <!-- footer strip -->
  <rect x="100" y="486" width="420" height="34" rx="17" fill="#ffffff" fill-opacity=".05"/>
  <text x="120" y="508" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#e8b9c2">Django · One-tap call · Bangla + English</text>
</svg>
